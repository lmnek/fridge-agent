[project]
name = "frida"
version = "0.1.0"
description = "Frida - chytrá lednička: kamera, AI agent, akce v Praze, Rohlík MCP a hlasový asistent přes Twilio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
    "httpx>=0.28.1",
    "selectolax>=1.0.2",
    "pillow>=13.0.0",
    "numpy>=2.5.0",
    "twilio>=9.13.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
# Push události z Reolink Home Hubu (Baichuan TCP push) přes knihovnu z Home Assistantu.
reolink = ["reolink-aio>=0.23.0"]
# Lokální vision transformery (OWLv2 detekce, SigLIP klasifikace, TrOCR čtení data spotřeby).
vision-local = ["torch>=2.15.0", "transformers>=5.22.0"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[project.scripts]
frida = "frida.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frida"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
